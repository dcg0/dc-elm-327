name: Build DC-ESCANER APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - run: chmod +x gradlew
      - run: ./gradlew assembleRelease --no-daemon

      - run: find androbd/build/outputs -name '*.apk'

      - uses: actions/upload-artifact@v4
        with:
          name: DC-ESCANER-APK-FINAL
          path: androbd/build/outputs/apk/**/*.apk
          retention-days: 90
          if-no-files-found: error
