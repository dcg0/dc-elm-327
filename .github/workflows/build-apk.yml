name: Build DC-ESCANER APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Verify unsigned artifact
        run: |
          test -s androbd/build/outputs/apk/release/androbd-release-unsigned.apk
          find androbd/build/outputs -name '*.apk' -type f -print
      - name: Upload unsigned APK for review
        uses: actions/upload-artifact@v7
        with:
          name: DC-ESCANER-APK-UNSIGNED
          path: androbd/build/outputs/apk/release/androbd-release-unsigned.apk
          retention-days: 30
          if-no-files-found: error

# Release signing is intentionally not performed here. The former keystore and
# password were public. Configure protected repository secrets before adding a
# release-signing job; never commit signing material to this repository.
